      background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);

      font-weight: 700;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(201,168,76,0.35);
